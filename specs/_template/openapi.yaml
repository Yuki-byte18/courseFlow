openapi: 3.1.0

info:
  title: courseFlow · <功能名称> API
  version: 1.0.0
  description: |
    对应规格：`specs/NNN-功能名称/spec.md`

    ## 认证方式
    除公开接口外，都需要请求头 `Authorization: Bearer <jwt>`。

    ## 统一错误响应

        {"error": {"code": "...", "message": "...", "request_id": "..."}}

servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地开发

# 默认全局需要认证；公开接口在具体 operation 上写 security: []
security:
  - bearerAuth: []

paths:
  /example:
    get:
      summary: 示例接口，写规格时替换掉
      description: |
        空一行之后可以写更长的说明。
        这里要写清楚：业务规则、幂等语义、数据范围限制。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录后拿到的 token，签名算法固定 HS256。

  schemas:
    ExampleItem:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: 机器可读的错误码
            message:
              type: string
              description: 面向用户的提示文案
            request_id:
              type: string
              description: 与响应头 X-Request-ID 一致

  responses:
    Unauthorized:
      description: 未认证或凭据无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: 已认证但权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
